url: https://paulesantos.github.io/rbioanp/

development:
  mode: release

template:
  bootstrap: 5
  bootswatch: cosmo
  includes:
    in_header: |
      <style>
        .navbar-primary, nav.navbar, .bg-primary {
          background-color: #ffffff !important;
          border-bottom: 1px solid #e2e8f0 !important;
          box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .navbar-brand {
          color: #1a202c !important;
          font-weight: 700 !important;
        }
        .nav-link, .nav-text {
          color: #4a5568 !important;
        }
        .nav-link:hover, .nav-link.active {
          color: #2b6cb0 !important;
          font-weight: 600;
        }
        a {
          color: #2b6cb0;
          text-decoration: none;
        }
        a:hover {
          color: #2c5282;
          text-decoration: underline;
        }
        img.logo, .page-header img, img[align="right"], .home img[align="right"] {
          max-height: 140px !important;
          max-width: 140px !important;
          height: auto !important;
          width: auto !important;
        }
      </style>

navbar:
  type: light
  bg: light
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/PaulESantos/rbioanp

reference:
  - title: Biodiversity & ANP Datasets
    desc: Core datasets providing access to Peru's protected area registry, flora, fauna, occurrences, and global biogeography.
    contents:
      - anp_list
      - anp_species_flora
      - anp_species_fauna
      - anp_species_occ
      - anp_especies_distr

articles:
  - title: Data Paper & Synthesis
    desc: Comprehensive biological and biogeographic analysis of datasets.
    contents:
      - data-paper
